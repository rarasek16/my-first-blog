<!DOCTYPE html>
<html>
<head>
    <title>Django Girls blog</title>
</head>
<body>
<header>
    <h1><a href="{% url 'post_list' %}">Django Girls Blog</a></h1>
    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'post_new' %}">New post</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
</header>

<aside>
    <h3>Categories</h3>
    <ul>
        <li><a href="{% url 'post_list' %}">All</a></li>
        {% for category in categories %}
            <li>
                <a href="{% url 'post_list_by_category' category.slug %}">{{ category.name }}</a>
            </li>
        {% empty %}
            <li>No categories</li>
        {% endfor %}
    </ul>
</aside>

<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
